version: 2

project_name: dot

builds:
  - id: dot
    main: ./cmd/dot
    binary: dot
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: default
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  groups:
    - title: Features
      regexp: '^.*feat[(\w)]*:+.*$'
      order: 0
    - title: Fixes
      regexp: '^.*fix[(\w)]*:+.*$'
      order: 1
    - title: Others
      order: 999
